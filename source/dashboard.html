<!doctype html>
<!-- data-shadow starts at "off" to match the 0 lengths the stylesheet
     defaults to, so the markup and the CSS agree before dashboard.js has
     read appearance.json (or if it can't). data-translucent is seeded the
     same way, and for the same reason: it selects the pass-through token
     block, which is what the plain :root defaults already amount to.

     data-theme is seeded to dark because that's the shipped default
     (appearance.example.json). The stylesheet's own :root is the light
     palette, so without this the window painted light for the moment
     before dashboard.js read appearance.json and corrected it -- a flash
     on every launch. dashboard.js still owns the attribute after that and
     will set it to "light" if that's what the file says. -->
<html lang="en" data-theme="dark" data-shadow="off" data-translucent="off">
<head>
<meta charset="utf-8">
<title>Balances</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* Every color below is a *-raw token, and nothing downstream in this
     stylesheet uses one directly: the --alpha-* derivation block further
     down turns each into the var() name the rules actually paint with. That
     indirection is what makes translucency a token-layer change instead of
     an edit to all sixty-odd color usages -- see "Translucency" below. */
  :root {
    color-scheme: light;
    --surface-0-raw:      #f3f4f6;
    --surface-1-raw:      #ffffff;
    --surface-2-raw:      #e5e7eb;
    --text-primary-raw:   #1f2937;
    --text-secondary-raw: #374151;
    --text-muted-raw:     #6b7280;
    --text-faint-raw:     #9ca3af;
    --ring-track-raw:      #e5e7eb;
    --error-surface-raw:   #fef2f2;
    --accent-raw:          #c9b7e8; /* overridden at runtime from appearance.json (Windows accent color); also stands in for the hardcoded green/red in the Uiverse source cards */
    --error-raw:           #ef4444;
    --scale:           1; /* overridden at runtime from appearance.json */
    --corner-radius:   20px; /* overridden at runtime from appearance.json */

    /* Design widths. --content-width is the room cards actually get (a
       credit card, or two debit cards plus the gap between them); #cards
       adds its own horizontal padding back on top. --extra-width is set
       at runtime by dashboard.js when an oversized amount needs more room
       than the default layout has, and is the total the window grows by.
       --debit-base is a
       debit box's share of an untouched row, used as-is when nothing
       overflows; when something does, dashboard.js computes each box's
       width itself (see distributeRowWidths) rather than expressing it
       here, because the share each box gets depends on the other boxes
       in its row. */
    --content-width:   301px;
    --card-gap:        8px;
    --extra-width:     0px;
    /* + the border twice for the same reason #cards' width takes it: each
       box gives that much back to its own inner width, so a shadowed row
       still ends flush with the credit card above it instead of leaving a
       strip of page showing at its right end. */
    --debit-base:      calc((var(--content-width) + var(--shadow-border) * 2 - var(--card-gap)) / 2);

    /* Neo-brutalist hard shadow + matching border (appearance.json
       "shadow"), taken from a CSS sample by micaelgomestavares on
       Uiverse.io: box-shadow: 10px 10px #323232 with a matching
       3px solid border. Both lengths default
       to 0 so the effect is simply absent unless it's switched on -- a
       0 0 hard shadow paints exactly behind the opaque card where nothing
       can see it, and a 0px border draws nothing -- which keeps this to
       one ruleset on .card instead of a second shadowed variant of it.
       --shadow-grow is the horizontal room the pair of them needs beyond
       the card's own box: the offset, plus the border twice, since the
       global box-sizing: border-box otherwise takes the border out of the
       card's *inner* width and squeezes the balance text. dashboard.js
       adds the same number to the window width it asks widget.py for --
       that width is computed, never measured, so growing it here alone
       would only have gotten the shadow clipped off. */
    --shadow-offset:   0px;
    --shadow-border:   0px;
    --shadow-color-raw: #323232;
    --shadow-grow:     calc(var(--shadow-offset) + var(--shadow-border) * 2);
  }

  /* Dark theme (appearance.json "dark_theme": true -- dashboard.js sets
     this attribute on <html>). Nothing here is a new rule: every color in
     the stylesheet below already comes from one of these variables, so the
     whole theme is this one block of redefinitions and nothing downstream
     needs a dark variant.

     Not black. The cards stay a step lighter than the page behind them,
     exactly as white-on-grey does in the light theme, because that step is
     what makes them read as cards rather than as regions of one dark
     sheet -- and a pure #000 page would make the rounded corners and the
     card edges vanish into the desktop wallpaper instead of floating on
     it. The hue is a cool blue-grey (not neutral) to match the light
     theme's slate text, so switching themes doesn't also change the
     widget's temperature.

     Text runs four steps dimmer rather than four steps of grey: on dark
     surfaces, lowering opacity-like lightness is what reads as hierarchy,
     where on white it's darkening. --text-primary stops short of #fff so
     the big balance numbers don't bloom against the dark card.

     color-scheme is set too, so the native scrollbar in #cards and any
     form UI WebView2 draws come out dark instead of a light strip. */
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-0-raw:      #1d2128;
    --surface-1-raw:      #292e37;
    --surface-2-raw:      #3e4651;
    --text-primary-raw:   #f2f4f7;
    --text-secondary-raw: #d5dbe3;
    --text-muted-raw:     #a2abb8;
    --text-faint-raw:     #7a8391;
    --ring-track-raw:     #3e4651;
    --error-raw:          #fa8585;
    --error-surface-raw:  #43282d;
    /* Dark, which only works because the surfaces above are mid-greys
       rather than near-black: this shadow has no blur, so it's a drawn
       edge and needs contrast to exist at all, and against a #1d2128 page
       a near-black slab has plenty. (It did not against the darker
       surfaces this theme started with, which is why a light inverted
       shadow was the right answer then and the wrong one now.) Darker
       than the page rather than equal to it, so the slab stays visible
       where it falls outside the card. appearance.json's shadow.color
       still overrides this. */
    --shadow-color-raw: #101318;
  }

  /* Shadow off, dark theme: a slightly darker card. With the shadow on,
     the dark border wraps each card in a thin frame that visually holds
     its surface down; take the frame away and the same grey reads as a
     brighter slab, bright enough to glare at a glance. So the card loses
     a step of lightness to compensate, and the two states end up looking
     equally bright even though they aren't the same color. The page
     behind it is left alone -- it's the card face that gets brighter, not
     the whole widget. Only the dark theme needs this: on white, a card
     without a border reads as paper, which is the point. */
  :root[data-theme="dark"][data-shadow="off"] {
    --surface-1-raw: #23272f;
  }

  /* Translucency (appearance.json "translucent_background" + "opacity").
     dashboard.js writes the four --alpha-* numbers; everything here just
     applies them. All four default to 1, which makes every color-mix below
     resolve to exactly its own raw token -- so with translucency off this
     whole layer is a no-op and the stylesheet paints the same colors it
     did before it existed.

     Four tiers, not one, because a single alpha applied uniformly reads as
     a faded screenshot rather than a translucent panel: the page backdrop
     takes the opacity you asked for in full, card faces take most of it,
     and the accent/bar and text tiers give up only a fraction of theirs so
     they stay legible sitting on top of the wallpaper. The per-tier
     fractions live in dashboard.js (TRANSLUCENCY_TIERS), not here, since
     they're arithmetic on one input rather than styling.

     color-mix against `transparent` is the mechanism: it takes a color of
     any format (these are hex, and --accent-raw is whatever
     appearance.json hands us) and returns it at a fraction of its alpha,
     without needing the tokens broken into r/g/b components. Resolution
     happens at use time, so this block sitting in plain :root still picks
     up the dark theme's raw values when [data-theme="dark"] is active --
     cascade order between the two blocks is irrelevant, they set different
     properties. */
  :root {
    --alpha-page:    1;
    --alpha-surface: 1;
    --alpha-accent:  1;
    --alpha-text:    1;
    --heading-darken: 0;

    --surface-0:      color-mix(in srgb, var(--surface-0-raw)      calc(var(--alpha-page) * 100%),    transparent);
    --surface-1:      color-mix(in srgb, var(--surface-1-raw)      calc(var(--alpha-surface) * 100%), transparent);
    --surface-2:      color-mix(in srgb, var(--surface-2-raw)      calc(var(--alpha-surface) * 100%), transparent);
    --error-surface:  color-mix(in srgb, var(--error-surface-raw)  calc(var(--alpha-surface) * 100%), transparent);
    /* The shadow follows the card rather than the page: it's a drawn edge
       belonging to the card it's cast by, and at page alpha it washed out
       into the wallpaper while the card above it still read as solid. */
    --shadow-color:   color-mix(in srgb, var(--shadow-color-raw)   calc(var(--alpha-surface) * 100%), transparent);
    /* The bar's track is on the accent tier, not the surface one, so the
       whole progress bar -- track and fill together -- fades as a single
       object instead of its background dropping out from under it. */
    --ring-track:     color-mix(in srgb, var(--ring-track-raw)     calc(var(--alpha-accent) * 100%),  transparent);
    --accent:         color-mix(in srgb, var(--accent-raw)         calc(var(--alpha-accent) * 100%),  transparent);
    --text-primary:   color-mix(in srgb, var(--text-primary-raw)   calc(var(--alpha-text) * 100%),    transparent);
    --text-secondary: color-mix(in srgb, var(--text-secondary-raw) calc(var(--alpha-text) * 100%),    transparent);
    --text-muted:     color-mix(in srgb, var(--text-muted-raw)     calc(var(--alpha-text) * 100%),    transparent);
    /* The section headings and the "updated" clock, and only those -- they
       are the one thing in the widget that sits on the page backdrop
       rather than on a card, so they're the only text whose background is
       the wallpaper itself at the full page alpha. A faint grey that reads
       as a quiet label against a solid page turns into unreadable haze
       over an arbitrary photo. So as the opacity falls they're pulled
       toward near-black, by --heading-darken (dashboard.js), which is 0 at
       full opacity and grows as the page disappears. Darkening rather than
       just solidifying because the problem isn't that they're faint, it's
       that they're mid-grey against an unknown and usually brighter
       surface. Both themes get this: in the dark theme the page is barely
       there at low opacity either way, so the heading's real backdrop is
       the wallpaper in both cases.

       Two nested mixes, applied in that order: darken first, then take the
       text tier's alpha, so the darkening doesn't get diluted by it. */
    --text-faint-shaded: color-mix(in srgb, #0b0e13 calc(var(--heading-darken) * 100%), var(--text-faint-raw));
    --text-faint:     color-mix(in srgb, var(--text-faint-shaded) calc(var(--alpha-text) * 100%),    transparent);
    --error:          color-mix(in srgb, var(--error-raw)          calc(var(--alpha-text) * 100%),    transparent);
  }

  /* Translucency off: the tokens go straight through, with no color-mix in
     the chain at all. Functionally this is identical to the block above
     with all four alphas at 1 -- that's deliberate, it's what makes the
     feature safe to leave on by default -- but it is not identical in
     cost. Every one of those twelve color-mix() calls is real work the
     style engine does on each recalc, and a color-mix result carries an
     alpha channel even when that alpha is 1.000, which keeps the card and
     page backgrounds on the compositor's blended path instead of letting
     it treat them as opaque fills it can draw over. Higher specificity
     than the plain :root above, so this simply wins when the attribute is
     "off".

     dashboard.js sets the attribute off for either of two reasons: the
     flag is false, or the opacity is 1 (asking for translucency and then
     asking for none of it). The alphas are still pinned at 1 here because
     .card-logo reads one as an element opacity, and opacity: 1 is the
     value browsers special-case into costing nothing. */
  :root[data-translucent="off"] {
    --alpha-page:    1;
    --alpha-surface: 1;
    --alpha-accent:  1;
    --alpha-text:    1;
    --heading-darken: 0;

    --surface-0:      var(--surface-0-raw);
    --surface-1:      var(--surface-1-raw);
    --surface-2:      var(--surface-2-raw);
    --error-surface:  var(--error-surface-raw);
    --shadow-color:   var(--shadow-color-raw);
    --ring-track:     var(--ring-track-raw);
    --accent:         var(--accent-raw);
    --text-primary:   var(--text-primary-raw);
    --text-secondary: var(--text-secondary-raw);
    --text-muted:     var(--text-muted-raw);
    --text-faint:     var(--text-faint-raw);
    --error:          var(--error-raw);
  }

  * { box-sizing: border-box; }

  /* html is the full (rectangular) window surface -- kept transparent so
     the corners that fall outside body's rounded box (clipped at the OS
     level in widget.py via SetWindowRgn) show the desktop through, instead
     of a square white/black frame around a rounded card. */
  html {
    margin: 0; padding: 0; background: transparent; overflow: hidden;
  }

  /* body is auto-sized on both axes -- it has no explicit width/height of
     its own, so it naturally grows/shrinks in BOTH dimensions to exactly
     match #shell's zoomed size (the same reason body.scrollHeight already
     reports the correctly-scaled height: zoom changes how much space a
     zoomed box occupies in its own parent's layout, not just how it's
     painted). Giving body its own fixed width here instead would leave it
     a step behind #shell's zoomed width -- shrunk content floating in a
     too-wide box, or wider content clipped by a too-narrow one. */
  body {
    margin: 0; padding: 0;
    background: var(--surface-0);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    border-radius: var(--corner-radius);
    width: auto; height: auto; max-height: 700px;
  }

  /* #shell itself stays width:auto -- zoom rescales what's *inside* an
     element, it doesn't reinterpret that element's own declared size. The
     400px design-width anchor has to live on #cards (inside the zoomed
     subtree) instead: zoom then renders "400px" at 400*scale actual
     pixels, and #shell's auto width naturally wraps that real rendered
     size, which is what propagates out to body (see body's comment).
     Putting width:400px directly on #shell left #shell always exactly
     400px wide regardless of scale (an explicit length on the zoomed
     element isn't itself rescaled), which is the whitespace/clipping bug
     this replaces. extra_spacing (appearance.json) sets #shell's margin at
     runtime -- margin (not padding) so negative values can pull content
     in past the card edges; overflow:hidden on html/body above prevents
     it from collapsing with body's own box. */
  #shell { margin: 0; zoom: var(--scale); }

  #cards {
    /* Shrunk from 400px to match the 20% credit-card truncation below --
       cards now fill 100% of this (already-truncated) width instead of
       leaving dead space in a full-size window. Grows by --extra-width
       when an oversized debit balance needs more room. */
    width: calc(var(--content-width) + 24px + var(--extra-width) + var(--shadow-grow));
    max-height: 700px;
    /* The shadow is cast down and to the right only, so only those two
       sides need extra room -- and only as much as the shadow actually
       occupies, which is the offset. The other half of --shadow-grow (the
       border, twice) is room for the cards themselves: border-box takes
       the border out of their *inner* width, so the window grows by it to
       give that width back rather than squeezing the balance text. Adding
       it to the padding here instead was the bug that left a wider margin
       on the right than the left -- padding is the one thing that decides
       how much whitespace sits beside the shadow, and 12px on both sides
       is what makes it even. The column gap grows by the offset too, or
       the next card down would be painted over the shadow of the one
       above it. */
    overflow-y: auto;
    padding: 10px calc(12px + var(--shadow-offset)) calc(10px + var(--shadow-offset)) 12px;
    display: flex; flex-direction: column; gap: calc(10px + var(--shadow-offset));
  }

  #cards::-webkit-scrollbar { width: 6px; }
  #cards::-webkit-scrollbar-thumb { background: var(--surface-2); border-radius: 3px; }

  .section { display: flex; flex-direction: column; gap: calc(6px + var(--shadow-offset)); }

  .section-title {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 10px; font-weight: 600; color: var(--text-faint);
    text-transform: uppercase; letter-spacing: 0.07em; padding: 2px 4px;
  }

  /* A real sibling of the title text inside the same (zoomed) section-title
     row, not an overlay positioned relative to the unscaled viewport --
     that's what let it drift out of alignment whenever scale != 1. */
  #updated {
    font-variant-numeric: tabular-nums; text-transform: none;
    letter-spacing: normal; font-weight: 500;
  }


  /* Card sizing/colors below are copied close to the two Uiverse.io source
     cards almost verbatim (padding, radius, font sizes, the 1rem rhythm
     between header/balance/bar) -- see README References. The one swap is
     their hardcoded green/red becomes var(--accent) throughout, so it
     tracks your live Windows accent color instead. */
  .card {
    background: var(--surface-1);
    border-radius: 20px;
    padding: 1rem;
    /* Inert at the 0 defaults -- see --shadow-offset above. */
    border: var(--shadow-border) solid var(--shadow-color);
    box-shadow: var(--shadow-offset) var(--shadow-offset) var(--shadow-color);
  }

  .card-head {
    display: flex; align-items: center;
  }

  /* Two per row for Checking & Savings -- these cards are short enough
     (logo/name/balance, no bar or due date) that a single column wastes
     the right half of the window. No forced aspect-ratio -- that was
     padding the box out past its actual content height; sizing to content
     (same padding as the credit cards) keeps top/bottom whitespace equal
     to theirs instead of artificially taller.

     Rows are independent flex containers rather than one shared grid:
     grid column tracks are shared by every row, so a grid couldn't let
     one row's card be wider than another row's without dragging all of
     them along. Each card is pinned to --debit-base (not a 1fr share of
     the row), so when the window grows for an oversized balance, only the
     card that actually needs the room takes it -- its row partner keeps
     the width it already had. */
  /* .card-grid's gap is the vertical one between debit rows, so it can
     take the shadow offset freely. .debit-row's is horizontal and feeds
     distributeRowWidths' px math via CARD_GAP in dashboard.js, so it's
     left alone: the right-hand card simply paints over the part of its
     neighbour's shadow that doesn't fit in 8px, which reads as the shadow
     tucking under it rather than as a defect. */
  .card-grid { display: flex; flex-direction: column; gap: calc(var(--card-gap) + var(--shadow-offset)); }
  .debit-row { display: flex; gap: var(--card-gap); }
  .card-grid .card {
    flex: 0 0 var(--debit-base);
    padding: 1rem;
    display: flex; flex-direction: column; justify-content: center;
  }
  /* A balance too long for even a widened box gets its own row, and
     matches the credit cards' width so it doesn't look out of place. */
  .debit-row-full .card { flex: 1 1 auto; }
  .card-grid .balance { margin: 0.6rem 0 0; font-size: 1.75rem; line-height: 1.95rem; }

  /* The one painted thing that isn't a color token -- an <img> of the
     institution's logo -- so it takes the accent tier's alpha as an
     element opacity instead. Without this it stays fully opaque while
     everything around it fades, and the logos end up the only solid
     objects on the card. Same tier as the accent so it tracks the bars and
     the card number, which is the company's own color showing up twice. */
  .card-logo {
    width: 1.5rem; height: 1.5rem; border-radius: 9999px; flex-shrink: 0;
    object-fit: cover; background: var(--surface-2);
    opacity: var(--alpha-accent);
  }

  .card-logo-fallback {
    width: 1.5rem; height: 1.5rem; border-radius: 9999px; flex-shrink: 0;
    background: var(--accent); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700;
  }

  /* Debit/savings header: logo + [bank name, "Debit ••1234"] grouped and
     vertically centered against the logo, instead of the bank name
     sitting on its own row with the mask line indented below the whole
     header. Declared after .card-logo/.card-logo-fallback so this size
     wins despite equal selector specificity. */
  .debit-head { align-items: center; }

  .debit-logo {
    width: 1.6rem; height: 1.6rem; font-size: 10px;
  }

  .debit-info {
    margin-left: 0.45rem; min-width: 0;
    display: flex; flex-direction: column; justify-content: center; gap: 1px;
  }

  .debit-info .bank-name { margin-left: 0; font-size: 13px; }

  .card-mask-line {
    color: var(--accent); font-weight: 600;
    font-size: 11px; font-variant-numeric: tabular-nums;
  }

  .bank-name {
    margin-left: 0.5rem; color: var(--text-secondary); font-size: 18px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    flex: 0 1 auto; min-width: 0; /* shrink-to-fit only -- no flex-grow, so a
      sibling's margin-left:auto (card-mask or due-inline) is the one that
      claims the row's leftover space, not this */
  }

  .card-grid .bank-name { font-size: 15px; }

  .card-mask {
    margin-left: 0.5rem; color: var(--accent); font-weight: 600;
    flex-shrink: 0; font-variant-numeric: tabular-nums;
  }

  .due-inline {
    margin-left: auto; flex-shrink: 0;
    font-size: 12px; color: var(--text-muted); font-weight: 500;
    white-space: nowrap;
  }

  .balance-row {
    display: flex; align-items: baseline; justify-content: space-between;
    margin: 0.85rem 0 0.3rem;
  }

  /* Less bottom padding than the shared .card default -- the usage bar
     sat with dead space below it before this, now that it's pulled up
     closer to the balance via .balance-row's smaller bottom margin. */
  .credit-card { padding-bottom: 0.75rem; }

  .balance {
    color: var(--text-primary);
    font-size: 2.25rem; line-height: 2.5rem; font-weight: 700;
    font-variant-numeric: tabular-nums; text-align: left;
  }

  .of-limit { color: var(--text-muted); font-size: 15px; font-weight: 400; }

  .util-pct {
    font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums;
    flex-shrink: 0; margin-left: 0.5rem;
  }

  /* Split into separately-rounded utilization sections rather than being
     one continuous track: the track color moved onto the sections
     themselves, so the gaps between them read as card-colored dividers
     and each section keeps rounded ends of its own. Which boundaries get
     a split is decided per-render -- see visibleRidges in dashboard.js. */
  .range {
    display: flex; gap: 2px;
    width: 100%; height: 0.5rem;
  }

  .range-seg {
    position: relative; flex: 0 1 0; /* flex-grow comes from the inline
      per-section span; a zero basis keeps the gaps from skewing the
      sections' relative widths */
    height: 100%; background-color: var(--ring-track);
    border-radius: 0.25rem; overflow: hidden;
  }

  .range .fill {
    position: absolute; top: 0; left: 0; height: 100%;
    background-color: var(--accent); border-radius: 0.25rem;
    transition: .5s all;
  }

  .error-card { background: var(--error-surface); }
  .error-card .msg { font-size: 15px; color: var(--error); font-weight: 600; }

  .empty {
    text-align: center; color: var(--text-muted); font-size: 13px;
    margin-top: 60px; padding: 0 20px;
  }
</style>
</head>
<body>
  <div id="shell">
    <div id="cards">
      <div class="empty">Loading&hellip;</div>
    </div>
  </div>
<script src="dashboard.js"></script>
</body>
</html>
